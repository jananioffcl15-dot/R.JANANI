<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduGenie - AI Learning Assistant</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        h2 {
            color: #333;
        }

        textarea {
            width: 100%;
            min-height: 80px;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 15px;
        }

        button {
            padding: 10px 18px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #3730a3;
        }

        .result {
            margin-top: 15px;
            padding: 15px;
            background: #f1f5f9;
            border-radius: 6px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>EduGenie</h1>

    <p class="subtitle">
        Google Gemini Powered Learning Assistant
    </p>


    <!-- ASK A QUESTION -->
    <div class="card">

        <h2>Ask a Question</h2>

        <textarea
            id="question"
            placeholder="Enter your question">
        </textarea>

        <button type="button" onclick="askQuestion()">
            Ask Question
        </button>

        <div id="qaResult" class="result"></div>

    </div>


    <!-- EXPLAIN A CONCEPT -->
    <div class="card">

        <h2>Explain a Concept</h2>

        <textarea
            id="concept"
            placeholder="Enter a concept">
        </textarea>

        <button type="button" onclick="explainConcept()">
            Explain Concept
        </button>

        <div id="explainResult" class="result"></div>

    </div>


    <!-- GENERATE QUIZ -->
    <div class="card">

        <h2>Generate Quiz</h2>

        <textarea
            id="quizTopic"
            placeholder="Enter a topic for quiz">
        </textarea>

        <button type="button" onclick="generateQuiz()">
            Generate Quiz
        </button>

        <div id="quizResult" class="result"></div>

    </div>


    <!-- SUMMARIZE TEXT -->
    <div class="card">

        <h2>Summarize Text</h2>

        <textarea
            id="summaryText"
            placeholder="Enter text to summarize">
        </textarea>

        <button type="button" onclick="summarizeText()">
            Summarize
        </button>

        <div id="summaryResult" class="result"></div>

    </div>


    <!-- LEARNING RECOMMENDATIONS -->
    <div class="card">

        <h2>Learning Recommendations</h2>

        <textarea
            id="learningTopic"
            placeholder="Enter a topic">
        </textarea>

        <button type="button" onclick="getRecommendations()">
            Get Recommendations
        </button>

        <div id="learningResult" class="result"></div>

    </div>

</div>


<script>

async function askQuestion() {

    const text = document.getElementById("question").value;

    const response = await fetch("/qa", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            text: text
        })
    });

    const data = await response.json();

    document.getElementById("qaResult").innerText =
        data.answer || JSON.stringify(data);
}


async function explainConcept() {

    const text = document.getElementById("concept").value;

    const response = await fetch("/explain", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            text: text
        })
    });

    const data = await response.json();

    document.getElementById("explainResult").innerText =
        data.explanation || JSON.stringify(data);
}


async function generateQuiz() {

    const text = document.getElementById("quizTopic").value;

    const response = await fetch("/quiz", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            text: text
        })
    });

    const data = await response.json();

    document.getElementById("quizResult").innerText =
        data.quiz || JSON.stringify(data);
}


async function summarizeText() {

    const text = document.getElementById("summaryText").value;

    const response = await fetch("/summarize", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            text: text
        })
    });

    const data = await response.json();

    document.getElementById("summaryResult").innerText =
        data.summary || JSON.stringify(data);
}


async function getRecommendations() {

    const text = document.getElementById("learningTopic").value;

    const response = await fetch("/learn/recommendations", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            text: text
        })
    });

    const data = await response.json();

    document.getElementById("learningResult").innerText =
        data.recommendations
        ? data.recommendations.join("\n")
        : JSON.stringify(data);
}

</script>

</body>
</html>
